syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";


message Simulation {
  string scenario_id = 1; // model configuration (Area, fleet, species, etc.)
  // string user_id = 2;	// user id will come from authentication
  google.protobuf.Timestamp start_date_time = 2; // start date and time of the simulation
  string step_size = 3; // time step size (e.g . 1 day, 1 month, 1 year) in ISO 8601 duration format
  string simulation_id = 4; // this simulation_id is generated by the client and should be unique for each simulation
  // repeated string relevant_species = 5;	// list of species that are relevant for the simulation
  google.protobuf.Timestamp simulation_created = 5; // date and time the simulation was created
  google.protobuf.Timestamp simulation_current = 6; // current date and time of the simulation
  string status = 7; // status of the simulation. Initializing, t.b.d.
  string ecology_host = 8;  // address of the ecology host that runs this simulation
}
